[pytest]
# Tests live at the repository root (CLAUDE.md §47) while the package lives in
# services/api. The root conftest.py puts the package on sys.path so the test
# tiers of §51 can all be run from one place.
testpaths = tests
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    unit: pure, in-memory tests — no database, no network
    contract: FHIR/NAMASTE/HIS mapping contract tests
    red_flag: clinical-safety regression suite; a deployment gate (§52)
    ai_eval: AI evaluation harness, including prompt-injection cases (§53)
    integration: requires the docker-compose stack (postgres/opa/redis)
    security: authorization, RLS and isolation tests (§51)
    load: capacity model tests (§54)
filterwarnings =
    ignore::DeprecationWarning
