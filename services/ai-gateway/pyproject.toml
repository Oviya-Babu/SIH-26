[project]
name = "medikiosk-ai-gateway"
version = "0.1.0"
description = """
MediKiosk AI Gateway — isolated inference tier (CLAUDE.md §18, §20).

[RED LINE §20] This service has NO database access. That is enforced three ways:
  1. network — it is attached only to ai-net; PostgreSQL is not on that network
  2. code    — no DB driver appears in these dependencies at all
  3. CI      — the build fails if a PostgreSQL connection string or credential
               appears anywhere under services/ai-gateway (§61)

Note the absence of asyncpg, psycopg, sqlalchemy and redis below. That absence is
the control, not an oversight.
"""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    # Phase 3: Voice (ASR/TTS/VAD)
    "numpy>=1.26.0",  # For audio processing and VAD
    "scipy>=1.12.0",  # Signal processing for noise suppression
    "onnxruntime>=1.18.0",  # Silero VAD CPU inference
    "faster-whisper>=1.1.0",  # Local CTranslate2 ASR
    "gTTS>=2.5.4",  # Local cache-seeded multilingual TTS
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medikiosk_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008"]
